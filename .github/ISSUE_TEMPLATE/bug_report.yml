name: Bug report
description: Report a reproducible Project Afterlight problem.
title: "[Bug] "
labels: []
body:
  - type: input
    id: version
    attributes:
      label: Pack version
      placeholder: 0.1.1
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - Multiplayer client
        - Dedicated server
        - Installation or launcher
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the island style, relevant mods/items, and whether extra mods were added.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Attach a reviewed latest.log or crash report. Remove credentials, personal paths, and server addresses first.
